services:
  apply-agent:
    build: .
    # Or skip the local build and use the published image:
    # image: ghcr.io/drajb/job-application-automation:latest
    image: apply-agent:latest
    container_name: apply-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The DB lives inside the mounted data/ volume so it survives restarts.
      # (Bind-mounting a not-yet-existing *file* makes Docker create a
      # directory in its place, which SQLite can't open.)
      APPLY_AGENT_DB: /app/data/apply_agent.db
    volumes:
      # secrets and persistent data
      - ./secrets:/app/secrets
      - ./resumes:/app/resumes:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, os; sqlite3.connect(os.environ['APPLY_AGENT_DB']).execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
