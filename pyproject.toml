[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-agent"
version = "0.1.0"
description = "Truthful, human-in-the-loop job-application agent. Tailors resumes, fills forms, requests Telegram approval before every submit. Runs on Gemini's free tier."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "job-search",
    "automation",
    "playwright",
    "gemini",
    "telegram-bot",
    "ats",
    "greenhouse",
    "lever",
    "human-in-the-loop",
    "resume",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    # core runtime
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "pyyaml>=6.0",

    # db
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sqlite-vec>=0.1.6",

    # encryption (age via pyrage; pure-rust ffi, has wheels for win/linux/mac)
    "pyrage>=1.2",

    # llm (Gemini ONLY per docs/SPEC.md §9; do not add anthropic/openai)
    "google-generativeai>=0.8",

    # telegram
    "python-telegram-bot[ext]>=21.5",

    # email
    "imap-tools>=1.6",

    # resume io
    "python-docx>=1.1",

    # browser (Tier-1 deterministic + Tier-2 driving)
    "playwright>=1.46",

    # embeddings (local bge-small-en-v1.5)
    "sentence-transformers>=3.0",

    # scraping
    "selectolax>=0.3",

    # cli niceties
    "rich>=13.7",

    # scheduler
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
apply-agent = "src.main:main"

[tool.setuptools]
packages = ["src"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    # google-generativeai emits a FutureWarning at import (Google is migrating
    # users to the `google-genai` package). The current SDK still works; this
    # keeps test output readable. See ROADMAP.md for the planned migration.
    "ignore::FutureWarning:google.generativeai",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
