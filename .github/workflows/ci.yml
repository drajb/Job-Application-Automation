name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch to keep CI fast (sentence-transformers needs torch).
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type-check
        run: python -m mypy src

      - name: Test
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Migrations match models
        env:
          APPLY_AGENT_DB: ${{ runner.temp }}/ci.db
        run: |
          python -m alembic upgrade head
          python - <<'EOF'
          import os
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from sqlalchemy import create_engine
          from src.db.models import Base
          with create_engine(f"sqlite:///{os.environ['APPLY_AGENT_DB']}").connect() as c:
              diff = compare_metadata(MigrationContext.configure(c), Base.metadata)
          assert not diff, f"models and migrations disagree: {diff}"
          print("ok: migrations match models")
          EOF

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    # Build (don't push) on every change so a broken image is caught before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: apply-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: docker run --rm apply-agent:ci python -m src.main --help

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit project dependencies
        run: |
          pip install pip-audit
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install .
          # Report-only: a fresh CVE in a transitive dep shouldn't block every PR.
          pip-audit || echo "::warning::pip-audit reported vulnerabilities — see log"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no committed secrets
        run: |
          set -e
          # Universal secret shapes — an age private key, a Google API key, or
          # a Telegram bot token must never land in the repo. These patterns
          # name no person; they're credential formats this project handles.
          if grep -rEn \
              --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ \
              --exclude-dir=secrets \
              '(AGE-SECRET-KEY-1[0-9A-Z]{20,}|AIza[0-9A-Za-z_-]{35}|[0-9]{8,10}:[A-Za-z0-9_-]{35})' \
              . ; then
              echo "::error::secret-shaped string detected in tree — see output above"
              exit 1
          fi
          echo "ok: no committed secrets"

      - name: Verify gitignore covers secrets
        run: |
          for pat in 'secrets/' '*.age.key' '*.db' '.env' 'chrome-profile-apply/' 'data/tailored/' 'profile.yaml' 'watchlist.yaml'; do
            if ! grep -qF "$pat" .gitignore; then
              echo "::error::.gitignore missing pattern: $pat"
              exit 1
            fi
          done
          echo "ok: gitignore covers all secret patterns"
